services:
  mysql-experiment:
    image: mysql:8.4
    profiles: [experiments]
    environment:
      MYSQL_DATABASE: concurrency_lab_exp_002_test
      MYSQL_USER: lab_exp
      MYSQL_PASSWORD: ${EXP_MYSQL_PASSWORD:-${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${EXP_MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_experiment_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u lab_exp concurrency_lab_exp_002_test -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
volumes:
  mysql_experiment_data:
