name: CI
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest tests/unit
      - run: uv run python scripts/verify_index_lab.py --verify-only
      - run: uv run python scripts/verify_scale_lab.py
      - run: uv run python scripts/verify_learning_docs.py
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Generate disposable local credentials
        run: |
          cp .env.example .env
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "REDIS_PASSWORD=$(openssl rand -hex 24)" >> .env
      - run: docker compose up -d --wait
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration
      - name: Start isolated index experiment instance
        run: docker compose -f compose.yaml -f compose.experiments.yaml --profile experiments up -d --wait mysql-experiment
      - run: uv run python scripts/provision_index_lab.py
      - name: Run real index experiment smoke tests
        env:
          EXPERIMENT_INTEGRATION: "1"
        run: uv run pytest tests/integration/test_index_baseline.py
      - name: Initialize isolated business dataset
        run: |
          uv run python scripts/provision_business_lab.py
          uv run python -m concurrency_lab.experiments.business_dataset --database concurrency_lab_business_test init
          uv run python -m concurrency_lab.experiments.business_dataset --database concurrency_lab_business_test seed --orders 10000
      - name: Real business transactions, paging, pool exhaustion and recovery
        env:
          BUSINESS_INTEGRATION: "1"
        run: uv run pytest tests/integration/test_business.py
      - name: Real Redis cache expiry, invalidation, concurrency and fallback
        env:
          CACHE_INTEGRATION: "1"
        run: uv run pytest tests/integration/test_product_cache.py
      - name: Explicit owned-business inventory migration
        run: uv run python -m concurrency_lab.experiments.business_schema --database concurrency_lab_business_test
      - name: Real inventory constraints, idempotency, lock timeout and deadlock recovery
        env:
          INVENTORY_INTEGRATION: "1"
        run: uv run pytest tests/integration/test_inventory.py
      - name: Explicit owned-business task migration
        run: uv run python -m concurrency_lab.experiments.business_schema --database concurrency_lab_business_test --revision 0005
      - name: Real task outbox, duplicate effect, deadlines and subprocess crash recovery
        env:
          TASK_INTEGRATION: "1"
        run: uv run pytest tests/integration/test_tasks.py
      - name: Provision only fixed009test targets
        run: uv run python scripts/provision_scale_lab.py
      - name: Real small009migration, streaming identity, plans, partition and failure guards
        env:
          SCALE_INTEGRATION: "1"
        run: uv run pytest tests/integration/test_scale.py
      - name: Enable isolated business API for browser tests
        run: |
          echo "BUSINESS_ENABLED=true" >> .env
          echo "BUSINESS_DATABASE=concurrency_lab_business_test" >> .env
          echo "BUSINESS_WRITES_ENABLED=true" >> .env
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real browser acceptance against MySQL and Redis
        run: npm run test:e2e
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visualization-screenshots
          path: docs/experiments/**/*.png
      - if: always()
        run: docker compose -f compose.yaml -f compose.experiments.yaml --profile experiments down

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
