[project]
name = "high-concurrency-lab"
version = "0.1.0"
description = "Spec-driven backend concurrency experiments"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3", "sqlalchemy[asyncio]>=2,<3", "asyncmy>=0.2,<1", "alembic>=1.14,<2", "redis>=5,<8", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "locust>=2.33,<3",
    "psutil>=7,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concurrency_lab"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
